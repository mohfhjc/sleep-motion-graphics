name: Professional Sleep Motion Graphics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q MyFiles.zip -d extracted

          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/src/index.jsx}"
            if [ -f "$candidate/package.json" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -path '*/src/index.jsx')

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project not found. ZIP contents:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Prepare browser
        run: |
          cd "$PROJECT_DIR"
          npx remotion browser ensure

      - name: Render video
        run: |
          cd "$PROJECT_DIR"
          npm run render
          find . -type f -name '*.mp4' -size +0c

          VIDEO=$(find out -type f -name '*.mp4' -size +0c | head -n 1)

          if [ -z "$VIDEO" ]; then
            echo "No MP4 video was generated."
            exit 1
          fi

          cp "$VIDEO" "$GITHUB_WORKSPACE/final-video.mp4"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Sleep-Motion-Video
          path: final-video.mp4
          if-no-files-found: error
          retention-days: 7
