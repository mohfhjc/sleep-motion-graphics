name: Render Sleep Motion Graphics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find and extract uploaded project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1 || true)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No package.json and no ZIP archive found in repository."
              exit 1
            fi
            echo "Extracting: $ZIP_FILE"
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
            PROJECT_DIR="$(find extracted -type f -path '*/src/index.jsx' -printf '%h\n' | sed 's#/src$##' | head -n 1)"
            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
              echo "ERROR: ZIP must contain package.json and src/index.jsx."
              find extracted -maxdepth 5 -type f | head -n 100
              exit 1
            fi
            cp -a "$PROJECT_DIR"/. .
          fi

      - name: Verify project files
        run: |
          test -f package.json
          test -f src/index.jsx
          test -f public/voice.mp3
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium dependencies
        run: npx remotion browser ensure

      - name: Render MP4
        run: |
          mkdir -p out
          npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: sleep-motion-video
          path: out/sleep-motion.mp4
          if-no-files-found: error
          retention-days: 7
