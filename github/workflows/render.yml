name: Render Sleep Motion Graphics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium dependencies
        run: npx remotion browser install

      - name: Render video
        run: npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: sleep-motion-graphics-video
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
